version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthtech_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: healthtech
      POSTGRES_PASSWORD: healthtech
      POSTGRES_DB: healthtech
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
